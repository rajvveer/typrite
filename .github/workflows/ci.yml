name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Typrite.Shell.Tests --configuration Release

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Typrite.Shell.Tests --configuration Release
      - run: dotnet build src/Typrite.Shell.Win32 --configuration Release
      - run: dotnet build src/Typrite.Desktop --configuration Release -p:Platform=x64
